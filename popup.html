<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail Weather Companion</title>
  <link rel="stylesheet" href="leaflet.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 360px;
      height: 540px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <div class="gwc-header">
    <div class="gwc-brand">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/>
      </svg>
      <span>Weather Companion</span>
    </div>
  </div>

  <div class="gwc-body">
    <div class="gwc-search-box">
      <input type="text" class="gwc-search-input" id="gwc-search-input" placeholder="Search city or zip code..." />
      <button class="gwc-search-btn" id="gwc-search-btn">Search</button>
    </div>

    <div id="gwc-weather-container">
      <div style="text-align: center; padding: 30px; color: var(--gwc-text-muted);">Loading weather data...</div>
    </div>
  </div>

  <div class="gwc-footer">
    <span style="font-size: 12px; color: var(--gwc-text-muted);">Temperature Unit</span>
    <div class="gwc-unit-toggle">
      <button class="gwc-unit-btn active" id="gwc-unit-f">°F</button>
      <button class="gwc-unit-btn" id="gwc-unit-c">°C</button>
    </div>
  </div>

  <script src="leaflet.js"></script>
  <script src="popup.js"></script>
</body>
</html>
